    nome: Nós e Amarras - Avançado
    questoes:
      - texto: "Ter a especialidade de Nós e Amarras. (Cole o certificado da especialidade no quadro abaixo)"
        dimensoes:
          largura: 20
          altura: 9
      - texto: "Fazer, pelo menos, 10 dos seguintes nós decorativos: (<strong><i>Pinha de saco dupla ou pinha com alça dupla ,Pinha de saco singela ,Coxim de Rosa ,Coxim da Vitória ,Coxim de tecer ,Coxim singelo ,Coxim em oito ,Nós Chato ,Nó Chato Torcido, ou nó de espiral ,Nó de gacheta triangular ,Nó de gacheta quadrada ,Nó de gacheta redonda ,Nó de peso ,Nó anel de três ,Pinha de vassoura ou trança de oito ,Pinha Cruzada ou pinha de retinida ,Pinha de Boça ,Pinha de Arganel ou nó do sultão ,Coxim Turco ,Coxim Sueco ,Coxim turco prolongado ,Pinha de cesto ,Coxim de anel de três ,Coxim de tear ,Coxim de esquadria ,Coxim de encapeladura dupla</i></strong>)<br><br><div class='text-center'>(Cole fotos das amarras feitas nos quadros abaixo)</div>"
        linhas: 4
        colunas: 3
        dimensoes:
          largura: 6
          altura: 6
        numero_linhas_transparentes: 4
      - texto: "Fazer de memória, pelo menos, 40 dos nós abaixo, falando ao avaliador o nome, para que serve e suas limitações. Fazer um relatório descrevendo cada um, citando para que serve e situações em que deve ser usado: <strong><i>(1) Nó simples, (2) Nó Aselha, (3) Nó Direito, (4) Nó Cego, (5) Nó direito alceado, (6) Nó direito andino, (7) Nó de escota, (8) Nó de escota alceado, (9) Volta da fiel, (10) Volta da fiel duplo, (11) Nó corrediço, (12) Nó oitavo corrediço, (13) Nó catau, (14) Nó catau com trava, (15) Nó fateixa, (16) Nó pescador, (17) Nó pescador duplo, (18) Nó oito, (19) Nó corrente de oito, (20) Nó oito duplo, (21) Nó nove, (22) Nó nove duplo, (23) Volta da ribeira, (24) Volta do salteador, (25) Lais de guia, (26) Lais de guia duplo, (27) Volta paradora, (28) Nó de forca ou carrasco, (29) Nó de frade, (30) Balso pelo seio, (31) Nó cadeira de bombeiro, (32) Nó moringa, (33) Nó de caminhoneiro, (34) Nó de cirurgião, (35) Nó de cirurgião duplo, (36) Nó arnez, (37) Nó de escada, (38) Nó de estribo, (39) Nó encapeladura, (40) Nó encapeladura dobrada, (41) Nó de barril, (42) Nó pata de gato, (43) Nó de trança, (44) Torniquete espanhol, (45) Nó cabeça de pássaro ou cabeça de cotovia, (46) Nó de ajuste, (47) Nó ordinário duplo, (48) Nó Josefina, (49) Nó vitória, (50) Nó de tecelão, (51) Nó quadrado, (52) Nó de gravata, (53) Nó de fita ou nó aquático, (54) Volta sobre o cabo, (55) Nó borboleta, (56) Nó corrente, (57) Nó de bombeiro espanhol, (58) Nó prussik, (59) Falcaça simples, (60) Falcaça americana, (61) Falcaça meias voltas mordidas, (62) Nó UIAA, (63) Nó UIAA duplo, (64) Nó tensor de barraca, (65) Nó em cadeia, (66) Amarra de andaime, (67) Volta da alça ou machard, (68) Nó espiral, (69) Lais de guia em elos, (70) Lais de Guia corrediço, (71) Trapa morrediça, (72) Laçada encavilhada, (73) Nó de cote, (74) Nó sangue, (75) Nó de estacha, (76) Nó de amarrar sapatos, (77) Nó espinha de peixe, (78) Nó de arreio, (79) Nó de cabresto (guntline), (80) Volta esticada, (81) Nó de Hunter ou Nó de caçador, (82) Nó de estivador, (83) Pinha de rosa simples, (84) Amor perfeito, (85) Nó trevo, (86) Nó 88, (87) Volta de gancho, (88) Nó de gancho dobrado, (89) Volta apertada, (90) Nó diamante, (91) Punho de adriça singela, (92) Nó cabeça de turco, (93) Nós de entrançar cabelo, (94) Nó costeleta, (95) Nó aventureiro, (96) Nó desbravador, (97) Nó viúva negra, (98) Nó menino</i></strong><br><div class='text-center'>(Item prático. Deve ser realizado na presença do instrutor)</div>"
        dimensoes:
          largura: 19
          altura: 9
      - texto: "Fazer as seguintes amarras: (Cole fotos das amarras feitas nos quadros abaixo)<br>a) Amarra Quadrada Japonesa<br>b) Amarra em Forma de Oito<br>c) Amarra Contínua Diagonal<br>d) Amarra Contínua Diagonal Dupla"
        linhas: 2
        colunas: 2
        dimensoes:
          largura: 8
          altura: 8
      - texto: "Explicar por que alguns móveis, passado alguns dias da sua confecção, ficam com as amarras frouxas. Como evitar isso?"
