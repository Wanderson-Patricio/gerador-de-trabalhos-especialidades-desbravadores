  - area: AR
    codigo: 118
    nome: Cubo Mágico
    questoes:
      - texto: "Possuir um cubo de Rubik (3x3x3)."
        numero_linhas: 0
      - texto: "Fazer um breve relato sobre a história do cubo de Rubik e mencionar a origem do seu nome."
        numero_linhas: 5
      - texto: "Quais são as cores opostas que um cubo de Rubik, que segue um padrão de cores tradicional, sempre terá? Se seu cubo não segue o padrão de cores tradicional, quais são as cores opostas que seu cubo apresenta?"
        numero_linhas: 2
      - texto: "Explicar a diferença entre montar e resolver o cubo mágico."
        numero_linhas: 3
      - texto: "Quais são os movimentos básicos possíveis de se fazer no cubo mágico? Em quais sentidos esses movimentos podem aparecer?"
        numero_linhas: 5
      - texto: "Existe forma e posição correta para se segurar o cubo mágico para resolvê-lo? Qual é a importância de segurá-lo corretamente ao executar um algoritmo?"
        numero_linhas: 3
      - texto: "Citar os principais métodos de resolução do cubo mágico. Qual é o método de resolução mais indicado para iniciantes? Descrever o passo a passo deste método."
        numero_linhas: 5
      - texto: "Existem casos impossíveis de serem resolvidos no cubo mágico? Por qual motivo isso pode acontecer? Citar quais são estes casos e descrever como resolver."
        numero_linhas: 5
      - texto: "Explicar os itens abaixo:"
        alternativas:
          - texto: "O que é algoritmo e qual é a relação do algoritmo com o cubo mágico?"
            numero_linhas: 3
          - texto: "O que é scramble?"
            numero_linhas: 3
          - texto: "O que significa o termo look ahead? Por que é de extrema importância treinar o look ahead?"
            numero_linhas: 3
          - texto: "O que são fingertricks? Por que é importante desenvolver estas técnicas para melhorar o seu desempenho no cubo mágico?"
            numero_linhas: 3
          - texto: "Definir o termo twisty  puzzle e qual a sua relação com o cubo mágico."
            numero_linhas: 3
            numero_linhas_transparentes: 2
      - texto: "O cubo mágico é considerado um esporte? Quando isso foi oficializado? Podemos chamar de atletas aqueles que praticam e participam de competições de cubo mágico?"
        numero_linhas: 3
      - texto: "Ser capaz de resolver um cubo mágico 3x3x3 usando o método de camadas em menos de cinco minutos. <br><div class='text-center'>(<strong><i>Item prático avaliado pelo instrutor</i></strong>)</div>"
        numero_linhas: 0
        numero_linhas_transparentes: 1
      - texto: "Demonstrar como limpar e lubrificar um cubo de Rubik."
        numero_linhas: 5



