  - area: AR
    codigo: 50
    nome: Acampamento I
    questoes:
      - texto: "Explicar e praticar o lema: 'não levar nada além de fotos, não deixar nada além de pegadas, não matar nada além do tempo'."
        numero_linhas: 5
      - texto: "Relacionar os objetos pessoais necessários para um acampamento de fim de semana. Descrever a roupa apropriada para dormir e como manter-se aquecido durante a noite."
        numero_linhas: 5
      - texto: "Saber organizar adequadamente a sua mochila de acampamento."
        numero_linhas: 3
      - texto: "Descrever as vantagens e desvantagens das opções de equipamentos para dormir ( colchonete,  colchão inflável, saco de dormir, etc.)."
        numero_linhas: 5
        numero_linhas_transparentes: 5
      - texto: "Participar de um acampamento de final de semana, com no mínimo 2 pernoites."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Montar uma  barraca corretamente. Conhecer as regras de segurança sobre o local de montar o acampamento."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Conhecer e praticar os princípios de higiene em um acampamento."
        numero_linhas: 4
        numero_linhas_transparentes: 2
      - texto: "Cumprir o seguinte durante o acampamento:"
        alternativas:
          - texto: "Demonstrar habilidade para escolher o local e preparar uma fogueira."
            dimensoes: 
              largura: 19
              altura: 10
          - texto: "Conhecer e praticar as regras de segurança para mexer com fogo."
            numero_linhas: 3
          - texto: "Fazer e acender uma fogueira sem uso de combustíveis"
            dimensoes:
              largura: 19
              altura: 10
          - texto: "Demonstrar como proteger a lenha que será usada em fogueiras, em caso de chuva ou mau tempo."
            numero_linhas: 3
          - texto: "Descrever como manter os utensílios de cozinha limpos."
            numero_linhas: 3
          - texto: "Fazer e comer pão no espeto em uma das refeições do acampamento."
            dimensoes:
              largura: 19
              altura: 10
      - texto: "Saber usar corretamente um canivete e uma machadinha. Conhecer e demonstrar regras de segurança no uso destas ferramentas."
        numero_linhas: 5


  - area: AR
    codigo: 51
    nome: Acampamento II
    questoes:
      - texto: Ter, no mínimo, 11 anos.
        dimensoes:
          largura: 20
          altura: 9
      - texto: Participar num acampamento de um final de semana com no mínimo 2 noites.
        dimensoes:
          largura: 20
          altura: 9
      - texto: Demonstrar como escolher um local adequado para montar uma barraca e depois
          montá-la corretamente.
        numero_linhas: 5
      - texto: 'Cumprir o seguinte durante o acampamento:'
        alternativas:
          - texto: Conhecer as opções de fogueira para se cozinhar e montar uma dessas fogueias.
            numero_linhas: 5
          - texto: Explicar como manter os  alimentos frescos sem o uso de equipamentos
              elétricos
            numero_linhas: 5
          - texto: Preparar, no mínimo, uma refeição principal (exceto café da manhã) em
              um acampamento de final de semana.
            dimensoes:
              largura: 19
              altura: 10
      - texto: Saber usar corretamente um machado ou  facão. Conhecer e demonstrar regras
          de segurança no uso destas ferramentas.
        numero_linhas: 5
      - texto: 'Participar em um culto durante o acampamento em uma das seguintes atividades:'
        alternativas:
          - texto: Devocional
            numero_linhas: 0
          - texto: Louvor
            numero_linhas: 0
          - texto: Louvor
            dimensoes:
              largura: 19
              altura: 10


  - area: AR
    codigo: 52
    nome: Acampamento III
    questoes:
      - texto: "Ter, no mínimo, 12 anos. (Cole uma cópia de um documento que comprove a idade)"
        dimensoes:
          largura: 20
          altura: 11
      - texto: "Revisar seis pontos importantes na seleção de um bom local de acampamento."
        numero_linhas: 10
      - texto: "Participar num acampamento de um final de semana com no mínimo 2 pernoites. (Cole fotos das atividades nos quadros abaixo)"
        dimensoes:
          largura: 20
          altura: 8
      - texto: "Demonstrar habilidade para montar e prender firmemente uma  barraca. Explicar como ocorre a condensação numa barraca e como preveni-la."
        numero_linhas: 5
      - texto: "Cumprir o seguinte durante um acampamento:"
        alternativas:
          - texto: "Construir as seguintes fogueiras e explicar seu uso: estrela, caçador, refletor. Rever as normas de segurança para a construção de fogueiras;<br><div class='text-center'>(Cole fotos das fogueiras no quadro abaixo)</div>"
            dimensoes:
              largura: 19
              altura: 9
          - texto: "Conhecer 3 maneiras de acender uma fogueira sem uso de  fósforos e acender uma fogueira usando um dos seguintes métodos: Pedra de fogo, Fricção, Centelha, Lente de vidro,  Fósforo de metal, Ar comprimido, pederneira."
            numero_linhas: 8
          - texto: "Preparar, no mínimo, 2 refeições principais diferentes em um acampamento de final de semana."
            linhas: 1
            colunas: 2
            dimensoes:
              largura: 9
              altura: 10
      - texto: "Saber usar corretamente uma cavadeira ou picareta. Conhecer e demonstrar regras de segurança no uso destas ferramentas."
        numero_linhas: 10
      - texto: "Demonstrar quatro amarras básicas e construir 2 moveis de acampamento usando estas amarras. Exemplo de moveis: mesa, banco/banquinho, lixeira, varal, sapateira, latrina, chuveiro, pia, prateleira, etc. <br><div class='text-center'>(Cole fotos das amarras e móveis feitos nos quadros abaixo)</div>"
        linhas: 3
        colunas: 2
        dimensoes:
          largura: 9
          altura: 7.8
      - texto: "Participar, em um culto durante o acampamento, em uma das seguintes atividades:<br>a) Devocional<br>b) Estudo da Lição da Escola Sabatina<br>c) História<br>d) Testemunho<br>e) Louvor<br>f) Sermão/Sermonete<br>g) Pôr do Sol<br><div class='text-center'>(Cole fotos das atividades no quadro abaixo)</div>"
        dimensoes:
          largura: 20
          altura: 12


  - area: AR
    codigo: 53
    nome: Acampamento IV
    questoes:
      - texto: "Ter, no mínimo, 13 anos. (Cole uma cópia de um documento que comprove a idade)"
        dimensoes:
          largura: 20
          altura: 9
      - texto: "Escrever uma redação de 200 palavras sobre como preservar a natureza em acampamento."
        numero_linhas: 13
      - texto: "Participar de um acampamentos de final de semana, com no mínimo 2 pernoites. (Cole fotos das atividades nos quadros abaixo)"
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Demonstrar habilidade para montar e prender firmemente uma  barraca, bem como limpá-la, dobrá-la e guardá-la. Praticar as regras de segurança ao escolher o local para se montar uma barraca."
        numero_linhas: 5
      - texto: "Cumprir o seguinte durante o acampamento:"
        alternativas:
          - texto: "Explicar como iniciar um fogo sob chuva, onde conseguir material para a 'mecha' que acenderá o fogo e como manter o fogo aceso."
            numero_linhas: 5
          - texto: "Explicar quais  madeiras são mais adequadas para se acender rapidamente uma fogueira e para fazer brasas para cozinhar."
            numero_linhas: 5
          - texto: "Demonstrar como cortar lenha."
            numero_linhas: 3
          - texto: "Planejar um cardápio ovolactovegetariano para um acampamento de 2 dias."
            numero_linhas: 8
          - texto: "Preparar, no mínimo, 4 refeições principais em um acampamento de final de semana. (Cole fotos das atividades nos quadros abaixo)"
            dimensoes:
              largura: 18
              altura: 10
          - texto: "Demonstrar como cuidar adequadamente dos alimentos e como protegê-los de animais."
            numero_linhas: 8
      - texto: "Explicar, pelo menos, 3 maneiras de se purificar a água em um acampamento. Purificar um pouco de água no acampamento usando uma dessas maneiras."
        numero_linhas: 5
      - texto: "Saber afiar uma faca/canivete e um machado/Machadinha. Conhecer e demonstrar regaras de segurança ao manusear e afiar estas ferramentas."
        numero_linhas: 5
      - texto: "Revisar as 4 amarras básicas e construir 2 moveis de acampamento usando estas amarras. Exemplo de moveis: mesa, banco/banquinho, lixeira, varal, sapateira, latrina, chuveiro, pia, prateleira, etc.<br><div class='text-center'>(Cole fotos das amarras nos quadros abaixo)</div>"
        linhas: 1
        colunas: 2
        dimensoes:
          largura: 10
          altura: 10
        numero_linhas_transparentes: 5
      - texto: "Planejar e conduzir uma atividade criativa apropriada para o sábado.<br><div class='text-center'>(Cole fotos da atividade nos quadros abaixo)</div>"
        dimensoes:
