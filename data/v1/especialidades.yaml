  - area: HD
    codigo: 6
    nome: "Orçamento Familiar"
    questoes:
      - texto: "O que é Orçamento Familiar e qual a importância de fazê-lo?"
        numero_linhas: 4
      - texto: "Fazer uma lista das despesas de sua família e classificá-las em necessárias, úteis e supérfluas."
        numero_linhas: 9
      - texto: "Verificar a lista de compras de mantimentos e produtos de higiene e limpeza de sua família. Escrever quais itens você considera extremamente importantes e que não podem ser esquecidos e quais não são tão significativos e que poderiam ser trocados ou mesmos excluídos."
        numero_linhas: 10
      - texto: "Descobrir qual é o melhor dia e local para se adquirir hortaliças, frutas e verduras em seu bairro."
        numero_linhas: 3
      - texto: "O que você e sua família podem fazer para economizar água e energia elétrica?"
        numero_linhas: 3
      - texto: "Que impostos sua família precisa pagar? Em qual mês eles devem ser pagos?"
        numero_linhas: 4
      - texto: "Que tipos de compras nunca deveriam ser feitas a prazo? por quê?"
        numero_linhas: 3
      - texto: "O que são juros? Como devem ser calculados? <br> <div class='text-center'>(Escreva a sua solução e cálculos no quadro abaixo)</div>"
        dimensoes:
          largura: 20
          altura: 6
      - texto: "Pesquisar qual a taxa de juros e encargos financeiros nas linhas de  crédito a seguir:"
        alternativas:
          - texto: "Cartão de crédito"
            numero_linhas: 3
          - texto: "Empréstimo pessoal"
            numero_linhas: 3
      - texto: "Que medidas devem ser tomadas quando a família está endividada?"
        numero_linhas: 3
      - texto: "Qual porcentagem da renda de uma família deve ser poupada? E por quê?"
        numero_linhas: 3
      - texto: "Pesquisar ao menos 2 métodos, além da caderneta de poupança, para investir o dinheiro poupado. Quais as vantagens e desvantagens de cada um?"
        numero_linhas: 6
      - texto: "Saber fazer o seguinte: <br>a) Preencher recibos <br>b) Pagar boletos e/ou faturas em um terminal de autoatendimento ou por smartphones <br>c) Arquivar recibos de pagamentos <br> d) Interpretar um extrato de conta corrente/poupança <br>e) Pagar contas e fazer compras pela internet <br> <div class='text-center'>(Item prático. Deve ser avaliado pelo instrutor)</div>"
        numero_linhas: 0
        numero_linhas_transparentes: 1
      - texto: "Manter um Orçamento pessoal e relatório de entrada e saída de dinheiro durante, pelo menos, 1 mês. <br> <div class='text-center'>(Anexe ao final do trabalho o orçamento mensal elaborado)</div>"
        numero_linhas: 0
        numero_linhas_transparentes: 1
      - texto: "Montar um orçamento familiar e manter um relatório preciso de entradas e saídas durante 1 mês (desbravadores mais jovens podem fazer isto em conjunto com os pais); os garotos e garotas que vivem em fazendas, podem fazer relatório ligados a agricultura, laticínios ou gado. <br> <div class='text-center'>(Anexe ao final do trabalho o orçamento familiar elaborado)</div>"
        numero_linhas: 0
        numero_linhas_transparentes: 8
      - texto: "Ler Malaquias 3:8-12 e escrever, no mínimo, 250 palavras sobre o que significa, para você, ser um mordomo fiel."
        numero_linhas: 20



