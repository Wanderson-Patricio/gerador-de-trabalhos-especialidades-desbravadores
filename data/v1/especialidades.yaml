  - area: EN
    codigo: 44
    nome: Ecologia
    questoes:
      - texto: "Saber o significado dos seguintes termos:"
        alternativas:
          - texto: "Ecologia"
            numero_linhas: 2
          - texto: "Plâncton"
            numero_linhas: 2
          - texto: "Populações"
            numero_linhas: 2
          - texto: "Comunidade"
            numero_linhas: 2
          - texto: "Ecossistemas"
            numero_linhas: 2
          - texto: "Conservação"
            numero_linhas: 2
          - texto: "Cadeia alimentar"
            numero_linhas: 2
          - texto: "Comunidade Clímax"
            numero_linhas: 2
          - texto: "Comensalismo"
            numero_linhas: 2
          - texto: "Autotrofismo"
            numero_linhas: 2
          - texto: "Sucessão  Ecológica"
            numero_linhas: 2
          - texto: "Bioma"
            numero_linhas: 2
          - texto: "Habitat"
            numero_linhas: 2
      - texto: "O que é uma pirâmide  ecológica? Por que ela tem esse formato?"
        numero_linhas: 3
      - texto: "Escolher um mamífero, um pássaro, um réptil e um anfíbio comuns na região em que você mora e construir para cada um deles um diagrama de sua pirâmide ecológica."
        linhas: 2
        colunas: 2
        dimensoes:
          largura: 9
          altura: 6.5 
      - texto: "Definir o que é ecossistema. Falar sobre os fatores biológicos e físicos que o mantém equilibrado."
        numero_linhas: 4
      - texto: "Utilizando-se de fotografias ou figuras, elaborar um cartaz ou quadro formando um diagrama ilustrando um ecossistema de um pequeno lago de água doce.<br> <div class='text-center'>(Desenhe o diagrama no quadro abaixo)</div>"
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Pesquisar sobre como se faz a coleta de lixo em seu bairro e qual o destino do lixo coletado. Elaborar um relatório com as informações de quanto lixo sua família joga por dia e como poderiam lidar melhor com isto."
        numero_linhas: 12
      - texto: "Pesquisar nos jornais ou em algum site especializado, por uma semana, os níveis de poluição atmosférica de uma cidade grande (a mais perto da sua, se você não morar numa cidade grande). Fazer um gráfico demonstrando a curva deste nível durante semana. Descobrir o que causa os pontos altos de sua curva do gráfico."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Relacionar 10 maneiras de trabalhar ativamente em favor do meio ambiente de sua comunidade e cidade. Colocar 4 delas em prática."
        numero_linhas: 10
      - texto: "Pesquisar um texto do Espírito de Profecia e um texto bíblico relacionado à ecologia. Apresentar uma explicação sobre sua relevância e aplicação aos nossos dias."
        numero_linhas: 6



