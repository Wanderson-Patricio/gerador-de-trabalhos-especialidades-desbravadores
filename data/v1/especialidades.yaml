  - area: AM
    codigo: 27
    nome: Pacificador
    questoes:
      - texto: "Identificar quatro causas de conflito descritas na bíblia. Leia as seguintes passagens como ponto de partida."
        alternativas:
          - texto: "Gálatas 2:11-14"
            numero_linhas: 2
          - texto: "I Coríntios 12:12-31"
            numero_linhas: 2
          - texto: "Gênesis 13:1-12"
            numero_linhas: 2
          - texto: "Tiago 4:1-3"
            numero_linhas: 2
      - texto: "Explicar as seguintes formas de abordar uma contradição e discutir com seu conselheiro ou unidade usando exemplos bíblicos e suas próprias experiências."
        alternativas:
          - texto: "Negação<br> &nbsp;&nbsp;&nbsp;&nbsp;1. Acusações mútuas<br> &nbsp;&nbsp;&nbsp;&nbsp;2. Fuga"
            numero_linhas: 5
            numero_linhas_transparentes: 5
          - texto: "Ataque<br> &nbsp;&nbsp;&nbsp;&nbsp;1. Luta<br> &nbsp;&nbsp;&nbsp;&nbsp;2. Fofoca<br> &nbsp;&nbsp;&nbsp;&nbsp;3. Ridicularização"
            numero_linhas: 5
          - texto: "Conciliação<br> &nbsp;&nbsp;&nbsp;&nbsp;1. Identificar o conflito<br> &nbsp;&nbsp;&nbsp;&nbsp;2. Conversar em particular com cada uma das partes<br> &nbsp;&nbsp;&nbsp;&nbsp;3. Negociação"
            numero_linhas: 5
      - texto: "Dramatizar uma situação de conflito ocorrida com você e analisar o seu comportamento na contradição e quais as opções de conciliação possíveis."
        dimensoes:
          largura: 20
          altura: 12



