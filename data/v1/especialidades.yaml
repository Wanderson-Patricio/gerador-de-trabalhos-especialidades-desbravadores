  # Adra
  - area: AD
    codigo: 1
    nome: Alívio da Fome
    questoes:
      - texto: "Ler ou assistir um documentário ou uma matéria jornalística referente ao tema da fome no mundo e discutir com a sua unidade do Clube de Desbravadores as medidas que estão sendo tomados para reduzi-la e apontar como você, desbravador, pode contribuir para esse feito.<br>(<strong>Faça um relatório sobre como o conteúdo assistido alterou a sua visão sobre como pode contribuir para reduzir a fome no mundo. Indique o nome e o tipo do conteúdo assistido.</strong>)"
        numero_linhas: 10
      - texto: "Entrevistar uma pessoa que realiza distribuição de  alimentos em sua  comunidade. Pode ser o líder da ASA de sua igreja, de outra igreja, ou de um centro /  restaurante comunitário. Perguntar sobre que tipo de pessoas são atendidas, o que as levam a necessitarem de alimento e como essas necessidades estão sendo satisfeitas. Fazer anotações durante a entrevista e compartilhar os resultados com seu instrutor."
        numero_linhas: 10
      - texto: "Descrever as causas da fome em seu país. Você poderá fazer isso através de uma redação (com, pelo menos, 500 palavras), uma apresentação audiovisual (de, pelo menos, 10 minutos), uma encenação ou produzindo um vídeo de cerca de 1 minuto."
        numero_linhas: 25
        numero_linhas_transparentes: 10
      - texto: "Fazer uma coleta de itens alimentícios para a ASA da sua igreja, de outra igreja, ou centro/restaurante comunitário ou, se isso não for possível, escolher uma família que precisa de assistência e lhe entregar os itens coletados.<br><ul><li><strong>Obs.:</strong>A sugestão é que sejam arrecadados pelo menos 50 alimentos não perecíveis. Deve-se prestar muita atenção ao prazo de validade dos produtos coletados. Produtos com prazo de validade expirado ou com indício de deterioração, como lata estufada, caruncho nas farinhas e feijões, mofo no arroz, etc., não devem ser coletados. Também devem ser levados em consideração os costumes de cada país ou região. Produtos desconhecidos ou que não fazem parte da alimentação do dia a dia tendem a ser mal utilizados ou não utilizados.</li></ul><div class='text-center'>(Cole uma foto da arrecadação de alimentos realizada)</div>"
        dimensoes:
          largura: 20
          altura: 15
        numero_linhas_transparentes: 5
      - texto: "Visitar um banco de alimentos, um centro de distribuição de alimentos ou um restaurante ou cozinha comunitária e dispor-se como voluntário para ajudar o pessoal que trabalha no estabelecimento. Conversar com eles para saber como os alimentos são obtidos e quais são alguns dos desafios para consegui-los, armazená-los e distribuí-los. Caso não exista nenhum dos estabelecimentos acima descritos em sua região, planejar e auxiliar a ASA na arrecadação de alimentos.<div class='text-center'>(Cole uma foto da atividade realizada)</div>"
        dimensoes:
          largura: 20
          altura: 15



  - area: AD
    codigo: 2
    nome: Avaliação da Comunidade
    questoes:
      - texto: "Selecionar uma  comunidade ou área urbana com a qual esteja familiarizado e descrever, da melhor forma possível, as seguintes informações:"
        alternativas:
          - texto: Localização em um mapa físico ou digital;
            numero_linhas: 2
          - texto: Demografia (nº de habitantes, de preferência distribuídos por sexo e idade)
            numero_linhas: 2
          - texto: Condições socioeconômicas
            numero_linhas: 2
          - texto: Ocupações laborais mais comuns
            numero_linhas: 2
          - texto: Acesso à rede educacional e de saúde
            numero_linhas: 3
          - texto: Nível de  educação
            numero_linhas: 2
          - texto: Nível de segurança
            numero_linhas: 2
          - texto: Outros dados que achar relevantes
            numero_linhas: 3
      - texto: "Listar as necessidades que você vê em sua comunidade. Isso pode incluir melhor apoio a famílias de baixa renda, assistência a idosos que vivem sozinhos, melhora na limpeza das áreas públicas, etc."
        numero_linhas: 8
      - texto: "Entrevistar um líder comunitário, professor, pastor de igreja ou oficial de polícia para saber como pessoas como você poderiam exercer impacto positivo em tal comunidade ou área. Fazer anotações. (Indique o nome e a ocupação da pessoa entrevistada)"
        numero_linhas: 12
      - texto: "Preparar um relatório para o seu Clube de Desbravadores apresentando suas descobertas e descrever o que você aprendeu especificamente a respeito da comunidade ou área que escolheu. Seja criativo."
        numero_linhas: 10
      - texto: "Descrever as melhorias mais importantes necessárias à sua comunidade e o que você pode fazer para ajudar."
        numero_linhas: 10


  - area: AD
    codigo: 3
    nome: Serviço Comunitário
    questoes:
      - texto: "Ler os seguintes textos bíblicos e explicar o que eles ensinam a respeito do papel que Deus espera que cada cristão desempenhe para satisfazer as necessidades dos pobres e sofredores na  comunidade."
        numero_linhas_transparentes: 5
        alternativas:
          - texto: "Isaías 58:3-12"
            numero_linhas: 5
          - texto: "Lucas 10: 25-37"
            numero_linhas: 5
          - texto: "Mateus 25:31-46"
            numero_linhas: 5
      - texto: "Explique o seguinte ao seu instrutor:"
        alternativas:
          - texto: "Qual é o significado do acrônimo ADRA? Apresentar uma breve explanação do que cada letra representa e explicar a diferença entre 'assistência' e 'desenvolvimento'."
            numero_linhas: 10
          - texto: "Qual o nome do  serviço social prestado pela Igreja Adventista do Sétimo Dia local que ajuda os pobres e necessitados em seu entorno. Que tipos de  serviços ele provê?"
            numero_linhas: 10
      - texto: "Reunir-se com o líder da Ação Solidária Adventista em sua área e perguntar a respeito dos projetos que sua unidade ou Clube de Desbravadores pode ajudar para satisfazer às necessidades da comunidade local."
        numero_linhas: 10
      - texto: "Realizar um projeto de serviço comunitário com a unidade ou Clube de Desbravadores e concluí-lo. Este projeto deve focar certas necessidades que sua comunidade apresenta."
        dimensoes:
          largura: 20
          altura: 15



  - area: AD
    codigo: 4
    nome: Resposta a Emergências e Desastres
    questoes:
      - texto: "Explicar os tipos de danos mais prováveis de ocorrer às casas, indivíduos e comunidades diante dos principais tipos de emergências e desastres e indicar em qual parte do mundo eles ocorrem com mais frequência. Você pode encontrar estas informações da Defesa Civil do seu Estado."
        alternativas:
          - texto: Ciclones (furacões e tufões)
            numero_linhas: 3
          - texto: Tornados
            numero_linhas: 3
          - texto: Inundações
            numero_linhas: 3
          - texto: Terremotos
            numero_linhas: 3
          - texto: Tsunamis
            numero_linhas: 3
          - texto: Incêndios
            numero_linhas: 4
          - texto: Guerras/conflitos ou  guerras civis
            numero_linhas: 3
      - texto: "Descrever os tipos de serviços prestados pela ADRA ou por outros órgãos de resposta a emergências e desastres locais aos sobreviventes de tais eventos em seu país."
        numero_linhas: 8
      - texto: "Ler um jornal ou notícias da ADRA referente a emergências e desastres recentes e discutir quais são algumas coisas importantes a se ter em mente ao responder a uma situação dessas."
        numero_linhas: 10
      - texto: "Explicar o que significa cada letra do acrônimo da ADRA e descreva o papel dela na resposta a emergências e desastres."
        numero_linhas: 10
      - texto: "Descrever, pelo menos, uma destas organizações de resposta a emergências e desastres e como ela pode trabalhar com a ADRA durante tais situações.<br><ol type='a'><li>Cruz Vermelha/Comitê Internacional da Cruz Vermelha (CICV)</li><li>Ação Solidária Adventista (ASA)</li><li>Alto Comissário das Nações Unidas para Refugiados - ACNUR</li><li>Programa Alimentar Mundial (PAM)</li></ol>"
        numero_linhas: 10
      - texto: "Explicar o papel do governo diante da ocorrência de uma emergência ou desastre e identificar a agência governamental chave em seu país que administra a resposta em tais situações."
        numero_linhas: 8
      - texto: "Descobrir na Bíblia um texto que possa ser usado para confortar e animar uma pessoa que experimentou perda total de sua casa, e dizer-lhe porque você escolheu esse texto?."
        numero_linhas: 8



  - area: AD
    codigo: 5
    nome: Resposta a Emergências e Desastres - avançado
    questoes:
      - texto: "Ter a especialidade de Nós e Amarras. (Cole o certificado da especialidade no quadro abaixo)"
        dimensoes:
          largura: 20
          altura: 9
      - texto: "Descrever as causas subjacentes de cada um desses cenários de desastres e dar um exemplo recente de, pelo menos, 6 desastres e seu impacto na comunidade ou país. Destacar, pelo menos, um no qual a ADRA respondeu."
        alternativas:
          - texto: Ciclones (furacões e tufões)
            numero_linhas: 4
          - texto: Tornados
            numero_linhas: 4
          - texto: Enchentes/Inundações
            numero_linhas: 3
          - texto: Secas
            numero_linhas: 3
          - texto: Tsunamis
            numero_linhas: 3
          - texto: Incêndios
            numero_linhas: 3
          - texto: Guerras/conflitos ou  guerras civis
            numero_linhas: 3
          - texto: Erupções vulcânicas.
            numero_linhas: 3
      - texto: "As 4 fases na gestão de emergências e desastres são: Prevenção / Mitigação, Preparo, Resposta e Recuperação. Em suas palavras, descrever para o seu instrutor o que cada um desses termos significa e porque são importantes."
        numero_linhas: 11
      - texto: "O preparo é chave para o sucesso em uma emergência ou desastre. Se você fosse construir um kit para tais circunstâncias, descrever para o seu instrutor quais itens seriam incluídos. Discutir as vantagens de escolher itens movidos à bateria e não à eletricidade, e alimentos não perecíveis em vez de perecíveis."
        numero_linhas: 8
      - texto: "Desenhar a planta do local onde você vive. Pensar no que faria em 3 dos desastres relacionadas no requisito 2. Traçar uma rota de fuga de sua casa e discuti-la com seu instrutor e família."
        dimensoes:
          largura: 20
          altura: 15
        numero_linhas_transparentes: 3
      - texto: "Encontrar 3 histórias na Bíblia que envolveram  desastres naturais ou emergências políticas. Colocar-se no lugar das pessoas da história e descrever como esses eventos o afetariam. Discutir como as pessoas nas histórias sobreviveram a essas situações."
        numero_linhas: 12
      - texto: "Apresentar um breve relatório para o seu Clube de Desbravadores a respeito do que você aprendeu sobre emergências e desastres e de estar preparado para agir nessas circunstâncias. Você pode fazer uma apresentação, encenação, mostrar um breve vídeo ou outro método que melhor transmita o que você aprendeu.<br><div class='text-center'>(Cole no quadro abaixo a foto da atividade realizada ou escreva o relatório)</div>"
        dimensoes:
          largura: 20
          altura: 12



  - area: AD
    codigo: 6
    nome: Alfabetização
    questoes:
      - texto: "Definir o termo alfabetização."
        numero_linhas: 3
      - texto: "Quais são as principais diferenças existentes entre alfabetização e letramento?"
        numero_linhas: 5
      - texto: "Pesquisar e descrever com brevidade como 2 ou 3 organizações em sua comunidade ou país promovem a alfabetização ou proveem serviços de alfabetização a crianças e adultos."
        numero_linhas: 10
      - texto: "Escrever um parágrafo explicando porque a alfabetização é importante."
        numero_linhas: 6
      - texto: "Realizar 3 das seguintes atividades <ol type='a'><li>Ajudar alguém a ler um pequeno livro ou uma breve  história.</li><li>Com um grupo de crianças, ler uma história em grupo, e em seguida resolver as dificuldades de compreensão.</li><li>Fazer 10 cartelas de material pedagógico com palavras simples e ilustrações ou fotos e passá-las a alguém que esteja aprendendo a ler.</li><li>Ler vários capítulos da Bíblia para uma pessoa idosa que você saiba que é cega ou incapaz de ler. Isso pode ser feito em uma ou várias visitas.</li><li>Fazer uma apresentação de 5 minutos em sua escola, igreja ou Clube, sobre o que você aprendeu sobre alfabetização.</li></ol><br><div class=text-center>(Cole fotos das atividades realizadas nos quadros abaixo)</div>"
        linhas: 2
        colunas: 2
        dimensoes:
          largura: 10
          altura: 9
      - texto: "Escolher 3 palavras e explicar ao seu instrutor como você ensinaria alguém sobre o significado das palavras e como soletrá-las."
        numero_linhas: 21



  - area: AD
    codigo: 7
    nome: Resolução de Conflitos
    questoes:
      - texto: "O que é um conflito?"
        numero_linhas: 5
      - texto: "Citar um exemplo de conflito em cada uma das seguintes configurações:"
        alternativas:
          - texto: Uma família
            numero_linhas: 2
          - texto: Grupo de amigos
            numero_linhas: 2
          - texto: Escola
            numero_linhas: 2
          - texto: Entre bairros e comunidades
            numero_linhas: 2
          - texto: Países
            numero_linhas: 2
      - texto: "O que é resolução de conflitos?"
        numero_linhas: 5
      - texto: "Conversar com o seu instrutor ou conselheiro sobre 4 causas prováveis que podem levar a conflitos na escola ou no ambiente de trabalho."
        numero_linhas: 8
      - texto: "Procurar informação sobre formas alternativas de resolução de conflitos: negociação, mediação, conciliação e arbitragem. Explique com suas próprias palavras cada conceito e dar um exemplo da cada alternativa."
        numero_linhas: 12
      - texto: "Explicar em que consiste a dramatização como uma dinâmica útil na resolução de conflitos e quais podem ser seus benefícios. Dar um exemplo e representá-lo com sua unidade."
        numero_linhas: 12
      - texto: "O que significa ouvir atentamente?"
        numero_linhas: 5
      - texto: "Aplicar o seguinte método de resolução de conflito em um exemplo do item número 1.<ol type='a'><li>Montar o cenário</li><li>Reunir informações</li><li>Identificar o problema</li><li>Pensar nas soluções</li><li>Negociar uma solução</li></ol>"
        numero_linhas: 10
      - texto: "Explicar como fazer encaminhamento a um conselheiro profissional ou pastor."
        numero_linhas: 7
      - texto: "Que atitude Jesus recomenda em Mateus 18:15 para resolver um conflito entre seus seguidores?"
        numero_linhas: 7
      - texto: "Qual papel de Jesus Cristo no conflito entre o bem e o mal de acordo com I Timóteo 2:5 e 6?"
        numero_linhas: 8
      - texto: "Mencionar outro personagem bíblico que foi mediador entre autoridades e seu povo."
        numero_linhas: 8



  - area: AD
    codigo: 8
    nome: Reassentamento de Refugiados
    questoes:
      - texto: "Descrever algumas causas gerais porque as  pessoas se deslocam para outros países como refugiados. Definir também os termos refugiado, deslocado interno e imigrante."
        numero_linhas: 12
      - texto: "Listar as necessidades imediatas que um refugiado pode ter quando chega a um novo país. Descrever como você se sentiria se, subitamente, tivesse que enfrentar uma nova língua, cultura e ambiente."
        numero_linhas: 12
      - texto: "Descobrir que organizações em sua  comunidade, país ou no mundo ajudam os refugiados e deslocados internos. Pesquisar sobre o trabalho que eles realizam."
        numero_linhas: 10
      - texto: "Descrever em poucas palavras como você poderia ajudar um refugiado ou um deslocado interno em sua comunidade."
        numero_linhas: 10
      - texto: "Perguntar a uma pessoa de outro país, que vive em sua comunidade, como ela se ajustou ao novo ambiente. Pedir para que descreva os desafios e contrastes que experimentou durante o processo de adaptação à comunidade."
        numero_linhas: 12
      - texto: "Fazer um breve relatório para o seu Clube de Desbravadores, igreja, escola sobre o que você aprendeu sobre refugiados e deslocados internos e que desafios eles enfrentam. Você pode levar a efeito este requisito através de uma apresentação audiovisual, encenação, vídeo ou qualquer outra forma que melhor transmita suas descobertas. Discutir porque é importante estar atento à situação dos refugiados e tentar encontrar soluções para esse problema."
        numero_linhas: 15
      - texto: "Encontrar um refugiado e/ou deslocado interno e auxiliá-lo em parceria com a ASA local. Coloque foto e a descrição do auxílio prestado."
        dimensoes:
          largura: 20
          altura: 10



  - area: AD
    codigo: 9
    nome: Desenvolvimento Comunitário
    questoes:
      - texto: "Definir desenvolvimento comunitário."
        numero_linhas: 7
      - texto: "Explicar ao seu instrutor porque alguns países são considerados desenvolvidos enquanto outros são chamados de países em desenvolvimento."
        numero_linhas: 7
      - texto: "Mencionar 5 países em desenvolvimento e listar 3 ações que a ADRA realiza neles e que poderiam ser consideradas ações de desenvolvimento e 2 que se caracterizam como ações assistenciais."
        numero_linhas: 8
      - texto: "Ler a respeito de porque existem pobres entre nós no livro O Libertador ou Desejado de Todas as Nações, de Ellen G. White, capítulo 70 - 'Cristo se identifica com os pobres e sofredores'. Descrever ao seu instrutor o que você aprendeu."
        numero_linhas: 15
      - texto: "Descrever, pelo menos, uma necessidade em seu bairro ou município que requeira atenção."
        numero_linhas: 5
      - texto: "Escrever um breve plano de desenvolvimento comunitário que pode ser implementado por seu Clube de Desbravadores (plantio de árvores, limpeza de parques e ruas, pintura de muros, etc.). O plano deve descrever a atividade, o tamanho do grupo, a logística de transporte e materiais e o tempo para completar tal atividade."
        numero_linhas: 11
      - texto: "Participar por, pelo menos, 4 horas em uma das seguintes atividades: <ol type='a'><li>O desbravador deverá contatar a Ação Solidária Adventista (ASA) de sua igreja e ver em que poderá ajudar. Talvez seja organizando itens doados ou participando de algum projeto por ela já estabelecido. Poderá envolver-se com a coleta e distribuição de alimentos, cobertores, agasalhos, sapatos e outros bens para moradores de rua ou para famílias cadastradas pela ASA. Ainda, poderá apoiar na reparação ou construção de casas para pessoas carentes.</li><li>O desbravador deverá contatar a ADRA para ver a possibilidade de envolver-se como voluntário em algum projeto que esteja sendo implementado no seu bairro ou município.</li><li>O desbravador deverá envolver-se com um Mutirão Social. O alvo deste tipo de mutirão é proporcionar à população menos favorecida acesso a certos serviços de forma gratuita. Alguns destes serviços são: corte de cabelo, testes rápidos para identificar doenças como sífilis, hepatite e AIDS, aferição de pressão arterial, orientações de saúde e nutrição, palestras educativas sobre como economizar energia e gás, recreação infantil, emissão de documento como carteira de trabalho, encaminhamento para vagas de empregos, entre outros. O mutirão pode ser feito no pátio da igreja, num centro comunitário, num ginásio de esportes ou outro local sugerido e autorizado pelas autoridades locais.</li><li>O desbravador deverá procurar saber o que sua igreja, outras igrejas, o governo ou organizações comunitárias estão fazendo pelos moradores de rua. Caso a comunidade já tenha esse programa, você poderá unir-se a ele.</li></ol><div class='text-center'>(Cole uma foto da atividade realizada no quadro abaixo)</div>"
        dimensoes:
          largura: 20
          altura: 12

