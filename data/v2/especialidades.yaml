        dimensoes:
          largura: 20
          altura: 15


  - area: AR
    codigo: 57
    nome: Liderança Campestre
    questoes:
      - texto: "Ter duas das especialidades a seguir: <br>a) Acampamento IV;<br>b) Fogueiras e Cozinha ao Ar Livre;<br>c) Mapa e Bússola;<br>d) Pioneirismo;<br>e) Pioneirias;<br>f) Primeiros Socorros - básico;<br><div class='text-center'>(Cole os certificados das especialidades escolhidas nos quadros abaixo)</div>"
        linhas: 1
        colunas: 2
        dimensoes:
          largura: 10
          altura: 10
      - texto: "Através do estudo da Bíblia e do Espírito de Profecia, aprender como as atividades ao ar livre influenciaram os seguintes personagens bíblicos:"
        alternativas:
          - texto: "Moisés;"
            numero_linhas: 3
          - texto: "Davi;"
            numero_linhas: 3
          - texto: "Elias;"
            numero_linhas: 3
          - texto: "João Batista;"
            numero_linhas: 3
          - texto: "Jesus;"
            numero_linhas: 3
      - texto: "Ensinar a um grupo de desbravadores como preservar e cuidar da natureza, abordando os seguintes tópicos:<br>a)  Segurança do acampamento;;<br>b) Segurança contra incêndios;<br>c) Saneamento;<br>d) Descarte correto do lixo;<br>e) Segurança no uso das fontes de água;<br>f) Regras de conduta.<br><div class='text-center'>(Cole fotos das atividades nos quadros abaixo)</div>"
        dimensoes:
          largura: 20
          altura: 9
      - texto: "Conhecer pelo menos 10 qualidades de um bom líder de desbravadores."
        numero_linhas: 4
      - texto: "Saber o que fazer para superar o medo quando estiver perdido. Conhecer pelo menos quatro maneiras de sinalizar pedidos de socorro se estiver perdido."
        numero_linhas: 5
      - texto: "Descrever pelo menos quatro atividades seculares e quatro atividades específicas para o sábado, para serem usadas ao ar livre, inclusive em um dia chuvoso."
        numero_linhas: 5
      - texto: "Completar o seguinte ao ar livre:"
        alternativas:
          - texto: "Planejar, organizar e ensinar uma das seguintes especialidades a um grupo de desbravadores: Acampamento I, Acampamento II, Acampamento III, Acampamento IV, Arte de acampar ou Fogueiras e  cozinha ao ar livre;<br><div class='text-center'>(Cole fotos das atividades nos quadros abaixo)</div>"
            dimensoes:
              largura: 20
              altura: 10
          - texto: "Saber onde fica o hospital mais próximo."
            numero_linhas: 3
