  - area: AM
    codigo: 27
    nome: Pacificador
    questoes:
      - texto: "Identificar quatro causas de conflito descritas na bíblia. Leia as seguintes passagens como ponto de partida."
        alternativas:
          - texto: "Gálatas 2:11-14"
            numero_linhas: 2
          - texto: "I Coríntios 12:12-31"
            numero_linhas: 2
          - texto: "Gênesis 13:1-12"
            numero_linhas: 2
          - texto: "Tiago 4:1-3"
            numero_linhas: 2
      - texto: "Explicar as seguintes formas de abordar uma contradição e discutir com seu conselheiro ou unidade usando exemplos bíblicos e suas próprias experiências."
        alternativas:
          - texto: "Negação<br> &nbsp;&nbsp;&nbsp;&nbsp;1. Acusações mútuas<br> &nbsp;&nbsp;&nbsp;&nbsp;2. Fuga"
            numero_linhas: 5
            numero_linhas_transparentes: 5
          - texto: "Ataque<br> &nbsp;&nbsp;&nbsp;&nbsp;1. Luta<br> &nbsp;&nbsp;&nbsp;&nbsp;2. Fofoca<br> &nbsp;&nbsp;&nbsp;&nbsp;3. Ridicularização"
            numero_linhas: 5
          - texto: "Conciliação<br> &nbsp;&nbsp;&nbsp;&nbsp;1. Identificar o conflito<br> &nbsp;&nbsp;&nbsp;&nbsp;2. Conversar em particular com cada uma das partes<br> &nbsp;&nbsp;&nbsp;&nbsp;3. Negociação"
            numero_linhas: 5
      - texto: "Dramatizar uma situação de conflito ocorrida com você e analisar o seu comportamento na contradição e quais as opções de conciliação possíveis."
        dimensoes:
          largura: 20
          altura: 12


  - area: AM
    codigo: 45
    nome: Sonoplastia
    questoes:
      - texto: "Defina o que é sonoplastia."
        numero_linhas: 3
      - texto: "Quais as qualidades de um sonoplasta?"
        numero_linhas: 3
      - texto: "Conhecer e mencionar a utilização dos equipamentos a seguir:"
        alternativas:
          - texto: "Mesa de som"
            numero_linhas: 2
          - texto: "Microfone"
            numero_linhas: 2
          - texto: "Fones de ouvido"
            numero_linhas: 2
          - texto: "Multicabo"
            numero_linhas: 2
          - texto: "Equalizador"
            numero_linhas: 2
          - texto: "Retorno"
            numero_linhas: 2
            numero_linhas_transparentes: 2
          - texto: "Compressor"
            numero_linhas: 2
          - texto: "Caixa de som"
            numero_linhas: 2
      - texto: "Qual a função de uma mesa de som? Utilizando a mesa de som de sua igreja, mencionar suas principais entradas e saídas e dizer o que faz cada botão."
        numero_linhas: 5
      - texto: "Quais os tipos de cabos mais usados na sonoplastia? Definir os usos de cada um."
        numero_linhas: 4
      - texto: "Quais os tipos de microfones mais utilizados?"
        numero_linhas: 3
      - texto: "O que pode atrapalhar o bom funcionamento de um microfone sem fio?"
        numero_linhas: 3
      - texto: "O que é equalização?"
        numero_linhas: 3
      - texto: "Qual a função de um compressor?"
        numero_linhas: 3
        numero_linhas_transparentes: 3
      - texto: "Como se dá a reverberação e como evitá-la?"
        numero_linhas: 3
      - texto: "Qual a importância de se possuir o cronograma do culto para poder operar o som?"
        numero_linhas: 3
      - texto: "Operar a mesa de som em, pelo menos, 2 programas, sob orientação do sonoplasta de sua igreja."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Auxiliar a equipe de sonoplastia da sua Igreja por, ao menos, 1 mês. (Escreva um breve relatório sobre sua experiência)"
        numero_linhas: 5


  - area: AM
    codigo: 46
    nome: Sonoplastia - Avançado
    questoes:
      - texto: "Ter a especialidade de Sonoplastia. (Cole o certificado da especialidade no quadro abaixo)"
        dimensoes:
          largura: 20
          altura: 8
      - texto: "Ter um certificado de curso de sonoplastia de, no minimo, 4 horas, ministrado por um profissional, com data inferior a 2 anos. (Cole o certificado no quadro abaixo)"
        numero_linhas_transparentes: 2
        dimensoes:
          largura: 20
          altura: 8
      - texto: "Atuar como operador de áudio em sua igreja por, no mínimo, 3 meses. (Escreva um breve relatório sobre sua experiência)"
        numero_linhas: 5
      - texto: "O que significa e qual a importância de observar a compatibilidade de potencia dos componentes da aparelhagem de som?"
        numero_linhas: 3
      - texto: "Listar 10 cuidados que devem ser seguidos para manter a aparelhagem de som em bom estado."
        numero_linhas: 10
      - texto: "Explicar o que causa e como é possível evitar a microfonia."
        numero_linhas: 3
      - texto: "Explicar a importância de utilizar  músicas apropriadas para cada situação"
        numero_linhas: 5
      - texto: "Fazer uma lista com, no mínimo, 5 hinos congregacionais indicados para as seguintes ocasiões: (Para cada hino, citar o porquê de tê-lo escolhido)"
        alternativas:
          - texto: "Programa do Clube de Desbravadores"
            numero_linhas: 2
          - texto: "Batismo"
            numero_linhas: 2
          - texto: "Doxologia"
            numero_linhas: 2
          - texto: "Funeral"
            numero_linhas: 2
          - texto: "Ação de Graças"
            numero_linhas: 2
      - texto: "Realizar uma pesquisa e listar as vantagens de um sistema integrado a um computador que utiliza algum programa de mixagem digital."
        numero_linhas: 5
      - texto: "Ser capaz de desconectar e conectar toda a aparelhagem de som (mesa, amplificador, computador, etc.). Em seguida, ligar, demonstrar o funcionamento do sistema de som e desligar, indicando e explicando a sequencia correta de encerramento. (Escreva um breve relatório sobre sua experiência)"
        numero_linhas: 5
      - texto: "Operar sozinho a  mesa de som de sua Igreja, identificando, explicando e demonstrando a função de cada um dos seguintes:"
        alternativas:
          - texto: "Canais de entrada"
            numero_linhas: 2
          - texto: "Canais de saída"
            numero_linhas: 2
            numero_linhas_transparentes: 2
          - texto: "Volume (geral e de canais individuais)"
            numero_linhas: 2
          - texto: "Ganho"
            numero_linhas: 2
          - texto: "Grave, médio e agudo"
            numero_linhas: 2
          - texto: "Efeito"
            numero_linhas: 2
      - texto: "Explicar como utilizar corretamente diferentes tipos de  microfone. Que cuidados devem ser observados quando guardados ou em uso?"
        numero_linhas: 5


  - area: AM
    codigo: 52
    nome: Apocalipse
    questoes:
      - texto: "O que significa a palavra apocalipse? Por que o Apocalipse foi enscrito em símbolos?"
        numero_linhas: 5
      - texto: "Elabore uma tabela com pelo menos cinco símbolos do Apocalipse e o significado de cada um. Levar em conta o princípio que as chaves para compreender o Apocalipse estão na própria Bíblia."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "O que é, no Apocalipse, o Selo de Deus? E a marca da besta?"
        numero_linhas: 5
      - texto: "Quem é digno de abrir os sete Selos? Por quê?"
        numero_linhas: 3
      - texto: "Faça um desenho encaixando os seguintes eventos num diagrama de linha do tempo: volta de Jesus, Primeira ressureição dos mortos, milênio, segunda ressureição e nova Terra."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Quais são as sete igrejas do Apocalipse e o que representam? Qual delas representa a nossa época e qual a mensagem que Deus tem para esta igreja?"
        numero_linhas: 5
      - texto: "Quais são as mensagens dos três anjos? Por que estas mensagens são importantes e devem ser proclamadas?"
        numero_linhas: 5
      - texto: "Citar três promessas do Apocalipse relacionadas ao noco Céu e à nova Terra."
        numero_linhas: 3


  - area: AM
    codigo: 54
    nome: Livro de Daniel
    questoes:
      - texto: "Por que é tão importante estudarmos atentamente o  livro do profeta Daniel?"
        numero_linhas: 3
      - texto: "Citar, pelo menos, três textos bíblicos que expliquem por que os judeus foram levados como cativos para a Babilônia."
        numero_linhas: 2
      - texto: "Qual é o significado dos nomes de Daniel, Misael, Azarias e Ananias."
        numero_linhas: 3
      - texto: "Ler Daniel 6:3, 4, 10 e 23 e dizer quais as virtudes de Daniel."
        numero_linhas: 3
      - texto: "Apresentar uma ilustração da estátua do sonho de Nabucodonosor descrita no capítulo 2 do livro de Daniel e explicar o significado de cada uma das partes."
        dimensoes:
          largura: 20
          altura: 7
      - texto: "O que podemos aprender com a história de Misael, Azarias e Ananias a respeito da firme decisão de não adorar a estátua de ouro de Nabucodonosor?"
        numero_linhas: 3
      - texto: "Quem apareceu na fornalha de fogo e na cova dos lões para proteger Daniel e seus amigos?"
        numero_linhas: 4
      - texto: "Quem escreveu o capítulo 4 do livro de Daniel?"
        numero_linhas: 2
      - texto: "Qual foi a mensagem esrita em uma parede e qual a explicação de cada uma das palavras? Por que aquela mensagem foi escrita naquela ocasião?"
        numero_linhas: 4
      - texto: "Fazer desenhos ou mostrar imagens ilustrativas dos animais de Daniel 7 e 8."
        linhas: 2
        colunas: 3
        dimensoes:
          largura: 6
          altura: 6
      - texto: "Dizer qual a relação entre os animais dos capítuls 7 e 8 com a estátua do capítulo 2. Qual é o significado do chifre pequeno do quarto animal de Daniel 7?"
        numero_linhas: 5
      - texto: "Que relação existe entre Daniel 7:25, Apocalipse 12:6, 14; 13:5-7?"
        numero_linhas: 4
      - texto: "Qual o sentido da visão do carneiro e do bode do capitulo 8 de Daniel?"
        numero_linhas: 4
      - texto: "Decorar e dizer qual a importância de Daniel 8:14 para a história do adventismo."
        numero_linhas: 5
      - texto: "Preparar um diagrama explicativo de Daniel 9:24-27."
        dimensoes:
          largura: 20
          altura: 10
      - texto: "Ler Daniel 12:4. Em que ano teve início o tempo do fim e que evento culimou para o início desse tempo?"
        numero_linhas: 8




